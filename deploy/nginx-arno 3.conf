# Nginx: site na raiz do domínio, tesouraria em subdomínio.
#
# Pasta site/     → arquivos estáticos (como hoje no root).
# Pasta application/ → NÃO é pasta pública. O Node escuta 127.0.0.1:4000
#                       e este server faz proxy de tesouraria.seudominio.org.
#
# DNS: tesouraria.seudominio.org → o mesmo IP do site.
# Certificado: certbot --nginx -d seudominio.org -d tesouraria.seudominio.org
#
# Build:
#   cd site && npm ci && npm run build          → copiar dist para o root abaixo
#   cd application && npm ci && npm run build && npm run db:up
#   cwd application → node backend/dist/index.js  (só localhost:4000)

# --- Site institucional ---
server {
  listen 80;
  listen [::]:80;
  server_name seudominio.org www.seudominio.org;
  return 301 https://seudominio.org$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name seudominio.org www.seudominio.org;

  ssl_certificate /etc/letsencrypt/live/seudominio.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/seudominio.org/privkey.pem;

  root /var/www/arno/site;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

# --- Tesouraria (login em https://tesouraria.seudominio.org/login) ---
server {
  listen 80;
  listen [::]:80;
  server_name tesouraria.seudominio.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name tesouraria.seudominio.org;

  ssl_certificate /etc/letsencrypt/live/seudominio.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/seudominio.org/privkey.pem;

  client_max_body_size 8m;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
